<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ORCA Marine Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body, html, #map {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #0A192F;
    }
    .leaflet-container {
      background: #0B192C;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    var map = L.map('map').setView([16.9891, 82.2475], 8);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Initial marker at Kakinada
    var marker = L.marker([16.9891, 82.2475]).addTo(map)
      .bindPopup('<b>Kakinada Port</b><br>Safe departure point')
      .openPopup();

    window.addEventListener("message", function(event) {
      try {
        var data = JSON.parse(event.data);
        if (data.type === 'SET_CENTER') {
          map.setView([data.lat, data.lon], data.zoom || 8);
        }
      } catch (e) {}
    });
  </script>
</body>
</html>
